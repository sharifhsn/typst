[package]
name = "typst-tests"
version = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
publish = false

[[test]]
name = "tests"
path = "src/tests.rs"
harness = false

# Structural tests for the DOCX exporter (standard libtest harness). Lives here,
# rather than in `crates/typst-docx`, so `typst-docx` need not dev-depend on the
# `typst` facade (which depends back on it).
[[test]]
name = "docx"
path = "src/docx.rs"

[[test]]
name = "pptx"
path = "src/pptx.rs"

[dependencies]
typst = { workspace = true }
typst-assets = { workspace = true, features = ["fonts"] }
typst-bundle = { workspace = true }
typst-dev-assets = { workspace = true }
typst-docx = { workspace = true }
typst-eval = { workspace = true }
typst-html = { workspace = true }
typst-kit = { workspace = true, features = ["datetime"] }
typst-layout = { workspace = true }
typst-library = { workspace = true }
typst-pdf = { workspace = true }
typst-pptx = { workspace = true }
typst-render = { workspace = true }
typst-svg = { workspace = true }
typst-syntax = { workspace = true }
typst-utils = { workspace = true }
base64 = { workspace = true }
bitflags = { workspace = true }
clap = { workspace = true }
comemo = { workspace = true }
ecow = { workspace = true }
hayro = { workspace = true }
hayro-svg = { workspace = true }
hayro-syntax = { workspace = true }
indexmap = { workspace = true }
open = { workspace = true }
oxipng = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
roxmltree = { workspace = true }
rustc-hash = { workspace = true }
serde_yaml = { workspace = true }
similar = { workspace = true }
smallvec = { workspace = true }
tar = { workspace = true }
time = { workspace = true }
tiny-skia = { workspace = true }
unscanny = { workspace = true }
walkdir = { workspace = true }
zip = { workspace = true }

[lints]
workspace = true
