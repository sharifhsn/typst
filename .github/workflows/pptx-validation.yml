name: PPTX structural validation

on:
  pull_request:
    paths:
      - "crates/typst-pptx/**"
      - "crates/typst-pptx-import/**"
      - "crates/typst-export-common/**"
      - "crates/typst-ooxml-core/**"
      - "crates/typst-cli/**"
      - "tests/src/pptx.rs"
      - "tests/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pptx-validation.yml"
  push:
    branches: [main, codex/office-export, docx-export, office-pandoc]
    paths:
      - "crates/typst-pptx/**"
      - "crates/typst-pptx-import/**"
      - "crates/typst-export-common/**"
      - "crates/typst-ooxml-core/**"
      - "crates/typst-cli/**"
      - "tests/src/pptx.rs"
      - "tests/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pptx-validation.yml"

permissions:
  contents: read

jobs:
  structural:
    name: Structural PPTX tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo test --locked -p typst-tests --test pptx --no-fail-fast
